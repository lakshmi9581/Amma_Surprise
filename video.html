<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>A Surprise For Amma ❤️</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            font-family: Georgia, serif;
            background: linear-gradient(135deg, #fff0f6, #eadcff);
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 30px 20px;
            overflow-x: hidden;
        }

        .container {
            width: 100%;
            max-width: 900px;
        }

        .heart {
            font-size: 55px;
            animation: heartbeat 1.3s infinite;
            margin-bottom: 15px;
        }

        h1 {
            color: #9b3d68;
            font-size: 42px;
            margin-bottom: 12px;
        }

        .subtitle {
            color: #70445a;
            font-size: 20px;
            line-height: 1.6;
            margin-bottom: 30px;
        }

        .video-box {
            background: white;
            padding: 12px;
            border-radius: 25px;
            box-shadow: 0 20px 50px rgba(100, 50, 90, 0.25);
            border: 3px solid #f3c4d8;
        }

        video {
            width: 100%;
            max-height: 550px;
            border-radius: 18px;
            display: block;
        }

        .bottom-message {
            margin-top: 28px;
            color: #9b3d68;
            font-size: 24px;
            font-weight: bold;
            line-height: 1.5;
        }

        .next-btn {
            margin-top: 25px;
            padding: 14px 28px;
            border: none;
            border-radius: 30px;
            background: #c75b87;
            color: white;
            font-size: 17px;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(120, 50, 90, 0.25);
        }

        .next-btn:hover {
            transform: scale(1.05);
        }

        .floating {
            position: fixed;
            font-size: 25px;
            animation: float 7s linear infinite;
            pointer-events: none;
        }

        @keyframes heartbeat {
            0%, 100% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.15);
            }
        }

        @keyframes float {
            from {
                transform: translateY(110vh);
                opacity: 0;
            }

            20% {
                opacity: 1;
            }

            to {
                transform: translateY(-120vh);
                opacity: 0;
            }
        }
    </style>
</head>

<body>

    <div class="floating" style="left: 8%;">❤️</div>
    <div class="floating" style="left: 25%; animation-delay: 2s;">🌸</div>
    <div class="floating" style="left: 50%; animation-delay: 1s;">❤️</div>
    <div class="floating" style="left: 75%; animation-delay: 3s;">🌷</div>
    <div class="floating" style="left: 90%; animation-delay: 4s;">💕</div>

    <div class="container">

        <div class="heart">❤️</div>

        <h1>Amma... This One Is For You 🥹</h1>

        <p class="subtitle">
            I made this little surprise with all my love... ❤️
            <br>
            Now sit back, watch it, and feel how much you mean to me. 🫂
        </p>

        <div class="video-box">

            <video controls>
                <source src="videos/Amma_surprise.mp4" type="video/mp4">

                Your browser does not support the video.
            </video>

        </div>

        <div class="bottom-message">
            You are my greatest blessing, Amma. ❤️
            <br>
            I love you forever. 🥹❤️
        </div>

        <button class="next-btn"
            onclick="window.location.href='pappa.html'">
            One Last Surprise... 💝
        </button>

    </div>

</body>
</html>
