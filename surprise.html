<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>A Special Surprise ❤️</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            font-family: Georgia, serif;
            background: linear-gradient(135deg, #ffe6f2, #eadcff);
            overflow: hidden;
        }

        .container {
            padding: 30px;
            max-width: 700px;
        }

        .heart {
            font-size: 90px;
            animation: heartbeat 1.2s infinite;
            margin-bottom: 25px;
        }

        h1 {
            font-size: 42px;
            color: #9b3d68;
            margin-bottom: 20px;
        }

        p {
            font-size: 22px;
            line-height: 1.7;
            color: #70445a;
        }

        .highlight {
            margin-top: 25px;
            font-size: 28px;
            color: #c04f80;
            font-weight: bold;
        }

        .next-btn {
            margin-top: 35px;
            padding: 15px 30px;
            border: none;
            border-radius: 30px;
            background: #c75b87;
            color: white;
            font-size: 18px;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(120, 50, 90, 0.25);
        }

        .next-btn:hover {
            transform: scale(1.05);
        }

        @keyframes heartbeat {
            0%, 100% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.2);
            }
        }

        .floating {
            position: absolute;
            font-size: 25px;
            animation: float 6s linear infinite;
        }

        @keyframes float {
            from {
                transform: translateY(100vh);
                opacity: 0;
            }

            20% {
                opacity: 1;
            }

            to {
                transform: translateY(-120vh);
                opacity: 0;
            }
        }
    </style>
</head>

<body>

    <div class="floating" style="left: 10%;">❤️</div>
    <div class="floating" style="left: 30%; animation-delay: 2s;">🌸</div>
    <div class="floating" style="left: 55%; animation-delay: 1s;">❤️</div>
    <div class="floating" style="left: 80%; animation-delay: 3s;">🌷</div>

    <div class="container">

        <div class="heart">❤️</div>

        <h1>Amma... This Is For You 🥹</h1>

        <p>
            Some feelings are too beautiful to fit into words...
            <br>
            So I wanted to show you instead. ❤️
        </p>

        <div class="highlight">
            You are my forever home. ❤️
        </div>

        <button class="next-btn" onclick="window.location.href='video.html'">
            There Is More... 🎁
        </button>

    </div>

</body>
</html>
